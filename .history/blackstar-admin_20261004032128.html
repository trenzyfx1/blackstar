<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Star Admin Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background: #f5f5f7; min-height: 100vh; padding: 2rem; }

  .admin-container { max-width: 1200px; margin: 0 auto; background: #ffffff; border-radius: 40px; padding: 2.5rem 2.2rem; box-shadow: 0 2px 20px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.04); }
  .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 12px; }
  .admin-header h1 { font-size: 1.5rem; font-weight: 700; color: #1c1c1e; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .admin-header h1 i { font-size: 1.2rem; color: #007aff; }
  .admin-header h1 .boss-badge { background: linear-gradient(135deg, #f7971e, #ffd200); color: #1c1c1e; font-size: 0.5rem; padding: 2px 10px; border-radius: 60px; font-weight: 700; letter-spacing: 0.5px; }
  .live-badge { background: #34c759; color: white; font-size: 0.6rem; padding: 2px 10px; border-radius: 60px; font-weight: 600; letter-spacing: 0.3px; margin-left: 8px; }

  .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .header-actions a, .header-actions button { background: #f0f0f0; border: none; padding: 0.5rem 1.2rem; border-radius: 60px; font-weight: 500; font-size: 0.85rem; color: #1c1c1e; cursor: pointer; transition: 0.15s; text-decoration: none; display: flex; align-items: center; gap: 6px; }
  .header-actions a:hover, .header-actions button:hover { background: #d1d1d6; }

  .stats { display: flex; gap: 16px; margin-bottom: 1.8rem; flex-wrap: wrap; }
  .stat-box { background: #f8f8fa; padding: 0.7rem 1.5rem; border-radius: 16px; display: flex; align-items: center; gap: 10px; }
  .stat-box span
